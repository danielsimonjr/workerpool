name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:

# Avoid duplicate runs: a PR-branch push + its pull_request event no longer both
# fire (push is limited to master), and any superseded run for the same ref is
# cancelled so the latest run completes instead of lingering as CANCELLED.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    # Defensive: a hung test process (e.g. a leaked worker keeping the event
    # loop open) must fail fast instead of silently burning the 6h GitHub
    # Actions default job timeout on every run.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
